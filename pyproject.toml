[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-project"
version = "0.1.0"
description = "Optimization benchmarks and bio-inspired algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pyyaml>=6.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
