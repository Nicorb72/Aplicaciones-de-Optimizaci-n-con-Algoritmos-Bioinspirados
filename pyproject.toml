[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-project"
version = "0.1.0"
description = "Optimization benchmarks and bio-inspired algorithms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "matplotlib==3.11.2",
  "pyyaml==6.0.3",
  "pillow==12.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
