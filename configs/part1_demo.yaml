# Configuración corta para demostración

runs: 30
seed: 42
success_threshold: 0.0001
output_dir: results/part1_demo

gd_dimensions: [2, 3]
heuristic_dimensions: [2]

functions:
  rosenbrock:
    domain: {lower: -2, upper: 2}
    learning_rate: 0.001

  rastrigin:
    domain: {lower: -5.12, upper: 5.12}
    learning_rate: 0.001

methods:
  gd:
    iterations: 100

  pso:
    particles: 10
    iterations: 39
    inertia: 0.7
    cognitive: 1.4
    social: 1.4

  evolutionary:
    population_size: 10
    generations: 78
    tournament_size: 3
    crossover_alpha: 0.3
    mutation_rate: 0.5
    mutation_sigma: 0.1
    elite_fraction: 0.5

  de:
    population_size: 10
    generations: 39
    f: 0.8
    cr: 0.7

animation:
  frames: 30
  fps: 10  