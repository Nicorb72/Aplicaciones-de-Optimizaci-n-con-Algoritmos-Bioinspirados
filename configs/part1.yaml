# Experimento principal: 30 corridas por configuración, semillas 42..71.
runs: 30
seed: 42
success_threshold: 0.0001
output_dir: results/part1

gd_dimensions: [2, 3]
heuristic_dimensions: [2, 3]

functions:
  rosenbrock:
    domain: {lower: -2, upper: 2}
    learning_rate: 0.001

  rastrigin:
    domain: {lower: -5.12, upper: 5.12}
    learning_rate: 0.001

methods:
  gd: {iterations: 10000}

  # En 2D: GD usa 1 + 2*2*10000 = 40001 unidades equivalentes.
  # En 3D: GD usa 1 + 2*3*10000 = 60001 unidades equivalentes.
  # Los tres métodos poblacionales hacen exactamente 40000 evaluaciones de f
  # en ambas dimensiones; el costo equivalente de GD depende de d.

  pso:
    particles: 40
    iterations: 999
    inertia: 0.7
    cognitive: 1.4
    social: 1.0

  evolutionary:
    population_size: 40
    generations: 1998
    tournament_size: 3
    crossover_alpha: 0.6
    mutation_rate: 0.5
    elite_fraction: 0.2
    # Evaluaciones = population_size + (population_size - elite_size) * generations

  de:
    population_size: 40
    generations: 999
    f: 0.7
    cr: 0.5

animation:
  frames: 30
  # Reproducción lenta para apreciar los paisajes y recorridos rápidos.
  fps: 4
