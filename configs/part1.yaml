# Experimento principal: 30 corridas por configuración, semillas 42..71.
runs: 30
seed: 42
success_threshold: 0.0001
output_dir: results/part1
gd_dimensions: [2, 3]
heuristic_dimensions: [2]
functions:
  rosenbrock:
    domain: {lower: -2, upper: 2}
    learning_rate: 0.001
  rastrigin:
    domain: {lower: -5.12, upper: 5.12}
    learning_rate: 0.001
methods:
  gd: {iterations: 10000}
  # En 2D: GD usa 1 + 2*2*10000 = 40001 unidades equivalentes.
  # Los tres métodos siguientes hacen exactamente 40000 evaluaciones de f.
  pso: {particles: 40, iterations: 999, inertia: 0.7, cognitive: 1.4, social: 1.4}
  evolutionary: {population_size: 40, generations: 1998, mutation_sigma: 0.1}
  de: {population_size: 40, generations: 999, f: 0.8, cr: 0.7}
animation: {frames: 60, fps: 5, pacing: movement}
